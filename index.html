<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Finance Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">

    <!-- ====================================================================
         1. LOGIN SCREEN CARD
         ==================================================================== -->
    <div id="login-card" class="card">
      <div class="card-header">
        <h2>Welcome Back</h2>
        <p>Sign in to manage your free-to-spend balance</p>
      </div>

      <!-- Visible Error/Success Message Box -->
      <div id="login-alert" class="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>

      <div class="card-footer">
        Don't have an account? <a id="link-to-signup">Sign Up</a>
      </div>
    </div>


    <!-- ====================================================================
         2. SIGNUP SCREEN CARD (Hidden by default)
         ==================================================================== -->
    <div id="signup-card" class="card hidden">
      <div class="card-header">
        <h2>Create Account</h2>
        <p>Start tracking your real available money</p>
      </div>

      <!-- Visible Error/Success Message Box -->
      <div id="signup-alert" class="alert"></div>

      <form id="signup-form">
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="••••••••" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>

      <div class="card-footer">
        Already have an account? <a id="link-to-login">Log In</a>
      </div>
    </div>


    <!-- ====================================================================
         3. DASHBOARD CONTAINER
         ==================================================================== -->
    <div id="dashboard-container" class="hidden">
      <!-- Balance Hero Card -->
      <div class="card dashboard-card">
        <div class="card-header">
          <p class="balance-label">Free-to-Spend Balance</p>
          <h1 id="free-to-spend-amount" class="balance-value">₹0.00</h1>
        </div>

        <!-- Dashboard Error/Success Alert Box -->
        <div id="dashboard-alert" class="alert"></div>

        <!-- Balance Update Action Section -->
        <div class="balance-actions">
          <button id="btn-toggle-update-balance" class="btn btn-secondary">Update Balance</button>

          <!-- Inline Update Form (Hidden by default) -->
          <form id="update-balance-form" class="inline-form hidden">
            <div class="form-group inline-group">
              <input type="number" id="update-balance-input" placeholder="Enter new balance" step="0.01" min="0" required>
              <button type="submit" class="btn btn-primary btn-inline">Save</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Commitments Section Card -->
      <div class="card commitments-card">
        <div class="section-header">
          <h3>Commitments</h3>
          <button id="btn-toggle-add-commitment" class="btn btn-secondary btn-sm">+ Add Commitment</button>
        </div>

        <!-- Inline Add Commitment Form (Hidden by default) -->
        <form id="add-commitment-form" class="inline-commitment-form hidden">
          <div class="form-group">
            <label for="commitment-name">Name</label>
            <input type="text" id="commitment-name" placeholder="e.g. Car EMI" required>
          </div>
          <div class="form-group">
            <label for="commitment-amount">Amount</label>
            <input type="number" id="commitment-amount" placeholder="0.00" step="0.01" min="0.01" required>
          </div>
          <div class="form-group">
            <label for="commitment-date">Due Date</label>
            <input type="date" id="commitment-date" required>
          </div>
          <div class="form-group">
            <label for="commitment-frequency">Frequency</label>
            <select id="commitment-frequency" required>
              <option value="MONTHLY">MONTHLY</option>
              <option value="WEEKLY">WEEKLY</option>
              <option value="ONE_TIME">ONE_TIME</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Save Commitment</button>
        </form>

        <!-- Commitment List Container -->
        <div id="commitments-list" class="commitments-list">
          <!-- Dynamically populated via script.js -->
        </div>
      </div>

    </div>

  </div>

  <!-- Application Logic -->
  <script src="script.js"></script>
</body>
</html>
