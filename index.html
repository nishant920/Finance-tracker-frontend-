<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Finance Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">

    <!-- ====================================================================
         1. LOGIN SCREEN CARD
         ==================================================================== -->
    <div id="login-card" class="card">
      <div class="card-header">
        <h2>Welcome Back</h2>
        <p>Sign in to manage your free-to-spend balance</p>
      </div>

      <!-- Visible Error/Success Message Box -->
      <div id="login-alert" class="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="email" required>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>

      <div class="card-footer">
        Don't have an account? <a id="link-to-signup">Sign Up</a>
      </div>
    </div>


    <!-- ====================================================================
         2. SIGNUP SCREEN CARD (Hidden by default)
         ==================================================================== -->
    <div id="signup-card" class="card hidden">
      <div class="card-header">
        <h2>Create Account</h2>
        <p>Start tracking your real available money</p>
      </div>

      <!-- Visible Error/Success Message Box -->
      <div id="signup-alert" class="alert"></div>

      <form id="signup-form">
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" placeholder="Name" required>
        </div>

        <div class="form-group">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" placeholder="email" required>
        </div>

        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="••••••••" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>

      <div class="card-footer">
        Already have an account? <a id="link-to-login">Log In</a>
      </div>
    </div>


    <!-- ====================================================================
         3. DASHBOARD CONTAINER (Empty placeholder for future prompts)
         ==================================================================== -->
    <div id="dashboard-container" class="hidden">
      <!-- Dashboard content will be built here in future steps -->
    </div>

  </div>

  <!-- Application Logic -->
  <script src="script.js"></script>
</body>
</html>
